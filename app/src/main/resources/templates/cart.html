<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Warenkorb')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main>
  <h1>Warenkorb</h1>
  <p th:if="${cart.empty}" data-testid="cart-empty">Der Warenkorb ist leer.</p>
  <table th:unless="${cart.empty}" class="lines">
    <thead><tr><th>Artikel</th><th>Menge</th><th>Einzelpreis</th><th>Summe</th><th></th></tr></thead>
    <tbody>
    <tr th:each="l : ${cart.lines}" th:attr="data-testid='cart-line-' + ${l.sku}">
      <td th:text="${l.description}">Artikel</td>
      <td th:text="${l.quantity}">1</td>
      <td th:text="${#numbers.formatDecimal(l.unitPrice, 1, 'POINT', 2, 'COMMA')} + ' €'">0</td>
      <td th:text="${#numbers.formatDecimal(l.lineTotal, 1, 'POINT', 2, 'COMMA')} + ' €'">0</td>
      <td><form method="post" th:action="@{/cart/items/{sku}/remove(sku=${l.sku})}"><button type="submit">Entfernen</button></form></td>
    </tr>
    </tbody>
    <tfoot><tr><th colspan="3">Gesamt</th><th data-testid="cart-total"
      th:text="${#numbers.formatDecimal(cart.total, 1, 'POINT', 2, 'COMMA')} + ' €'">0</th><th></th></tr></tfoot>
  </table>
  <p th:unless="${cart.empty}"><a class="button" th:href="@{/checkout}" data-testid="to-checkout">Zur Kasse</a></p>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
