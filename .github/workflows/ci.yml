# CI-Pipeline des Fermate-Webshops: Formatierung → Unit → Integration → Image → E2E → Bericht.
name: CI

on:
  pull_request:
    paths: [ "app/**", ".github/workflows/ci.yml" ]
  push:
    branches: [ main ]
    paths: [ "app/**", ".github/workflows/ci.yml" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  IMAGE: ghcr.io/${{ github.repository }}/fermate-shop

defaults:
  run:
    working-directory: app

jobs:
  lint:
    name: Formatierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}", cache: maven }
      - run: mvn -B -ntp spotless:check

  unit:
    name: Unit-Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}", cache: maven }
      - run: mvn -B -ntp test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-unit
          path: |
            app/target/surefire-reports/*.xml
            app/target/allure-results
          retention-days: 14

  integration:
    name: Integrationstests
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}", cache: maven }
      - run: mvn -B -ntp verify -DskipUnitTests=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-integration
          path: |
            app/target/failsafe-reports/*.xml
            app/target/allure-results
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: app/target/shop-*.jar
          retention-days: 1

  build-image:
    name: Docker-Image
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: jar, path: app/target }
      # Registry-Namen müssen kleingeschrieben sein.
      - id: image
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Zusätzliches Tag „main" für den Nightly-Lasttest
      - if: github.ref == 'refs/heads/main'
        run: docker buildx imagetools create -t ${{ steps.image.outputs.name }}:main ${{ steps.meta.outputs.tags }}

  e2e:
    name: End-to-End-Tests
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ${{ needs.build-image.outputs.image }}
      PAYMENT_CALLBACK_TOKEN: ${{ secrets.PAYMENT_CALLBACK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose pull --quiet
      - run: docker compose up --detach --wait webshop
      - run: docker compose --profile e2e run --rm e2e
      - if: failure()
        run: docker compose logs --no-color webshop keycloak payment > compose-logs.txt
      - run: docker compose down --volumes
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-e2e
          path: |
            app/e2e/test-results
            app/e2e/playwright-report
            app/e2e/allure-results
            app/compose-logs.txt
          retention-days: 14

  report:
    name: Testbericht
    needs: [ unit, integration, e2e ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: results-*, path: results }
      - uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "results/**/*.xml"
          check_name: Testergebnisse (Unit, Integration, E2E)
          include_passed: true
          detailed_summary: true
      # Allure-Verlauf über die letzten Läufe wird im Cache gehalten.
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: mkdir -p allure-results && find results -type d -name allure-results -exec sh -c 'cp -r "$1"/. allure-results/' _ {} \;
      - uses: actions/cache/restore@v4
        with:
          path: allure-results/history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: allure-history-${{ github.ref_name }}-
      - run: npx --yes allure-commandline@2.46.1 generate allure-results --clean --output allure-report
      - uses: actions/cache/save@v4
        with:
          path: allure-report/history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30
